<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎨 Sudoku Coloré</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --c1:#FF6B6B;--c2:#FF9F43;--c3:#FFEAA7;
    --c4:#55EFC4;--c5:#74B9FF;--c6:#A29BFE;
    --c7:#FD79A8;--c8:#00CEC9;--c9:#6C5CE7;
  }
  *{margin:0;padding:0;box-sizing:border-box;}

  /* ══ ANIMATED RAINBOW BACKGROUND ══ */
  body{
    font-family:'Nunito',sans-serif;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:20px;overflow-x:hidden;
    background:linear-gradient(270deg,
      #ff6b6b,#ff9f43,#ffeaa7,#55efc4,
      #74b9ff,#a29bfe,#fd79a8,#6c5ce7,#ff6b6b);
    background-size:1800% 1800%;
    animation:bgShift 18s ease infinite;
    position:relative;
  }
  @keyframes bgShift{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }

  /* dark overlay so content stays readable */
  body::after{
    content:'';position:fixed;inset:0;
    background:rgba(8,4,35,0.55);
    pointer-events:none;z-index:0;
  }

  /* ══ BUBBLES ══ */
  #bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .bubble{
    position:absolute;bottom:-140px;border-radius:50%;
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%  {transform:translateY(0) scale(1);opacity:.22;}
    85% {opacity:.22;}
    100%{transform:translateY(-115vh) scale(1.3);opacity:0;}
  }

  /* ══ MUSICAL NOTES ══ */
  #notes{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .note{
    position:absolute;
    animation:floatNote linear infinite;
    user-select:none;
  }
  @keyframes floatNote{
    0%  {transform:translateY(105vh) rotate(-10deg);opacity:0;}
    8%  {opacity:.75;}
    80% {opacity:.6;}
    100%{transform:translateY(-8vh) rotate(18deg);opacity:0;}
  }

  /* ══ CONTAINER ══ */
  .container{
    position:relative;z-index:1;
    width:100%;max-width:560px;
    display:flex;flex-direction:column;align-items:center;gap:20px;
  }

  /* ══ HEADER ══ */
  header{text-align:center;animation:fadeDown .8s ease;}
  @keyframes fadeDown{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}

  header h1{
    font-family:'Pacifico',cursive;
    font-size:clamp(2.4rem,8vw,3.4rem);
    background:linear-gradient(90deg,#fff,#FFD3E8,#C8F0FF,#D5FFEA,#FFF8C8,#fff);
    background-size:300%;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    animation:shimmer 3s linear infinite;
    filter:drop-shadow(0 0 18px rgba(255,255,255,.7));
    line-height:1.2;
  }
  @keyframes shimmer{0%{background-position:0%}100%{background-position:300%}}
  header p{color:rgba(255,255,255,.88);font-size:.95rem;margin-top:4px;letter-spacing:.05em;}

  /* ══ CONTROLS ══ */
  .controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;animation:fadeUp .8s ease .2s both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .btn{
    padding:10px 22px;border:none;border-radius:50px;
    font-family:'Nunito',sans-serif;font-weight:800;font-size:.9rem;
    cursor:pointer;transition:all .25s ease;letter-spacing:.04em;text-transform:uppercase;
  }
  .btn:hover{transform:scale(1.08) translateY(-2px);}
  .btn:active{transform:scale(.97);}
  .btn-new  {background:linear-gradient(135deg,var(--c5),var(--c6));color:#fff;box-shadow:0 4px 20px rgba(116,185,255,.55);}
  .btn-hint {background:linear-gradient(135deg,var(--c4),var(--c8));color:#fff;box-shadow:0 4px 20px rgba(85,239,196,.55);}
  .btn-check{background:linear-gradient(135deg,var(--c2),var(--c1));color:#fff;box-shadow:0 4px 20px rgba(255,159,67,.55);}
  .btn-solve{background:linear-gradient(135deg,var(--c7),var(--c9));color:#fff;box-shadow:0 4px 20px rgba(253,121,168,.55);}

  /* ══ TIMER & STATUS ══ */
  .info-bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center;}
  .timer{
    font-size:1.4rem;font-weight:900;color:#fff;
    background:rgba(255,255,255,.14);
    border:2px solid rgba(255,255,255,.3);
    padding:6px 20px;border-radius:50px;letter-spacing:.08em;
    backdrop-filter:blur(8px);box-shadow:0 4px 20px rgba(0,0,0,.25);
  }
  .status{font-size:.95rem;font-weight:700;color:#fff;min-height:24px;text-shadow:0 1px 6px rgba(0,0,0,.5);}

  /* ══ GRID ══ */
  .grid-wrapper{
    background:rgba(0,0,0,.3);border-radius:22px;padding:14px;
    backdrop-filter:blur(14px);
    border:2px solid rgba(255,255,255,.22);
    box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);
    animation:fadeUp .8s ease .4s both;
  }
  #sudoku-grid{
    display:grid;grid-template-columns:repeat(9,1fr);
    gap:3px;
    width:min(90vw,486px);height:min(90vw,486px);
  }
  .cell{
    border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-size:clamp(1rem,3.5vw,1.4rem);font-weight:800;
    cursor:pointer;transition:all .2s ease;
    position:relative;user-select:none;border:2px solid transparent;
  }
  .cell[data-col="2"],.cell[data-col="5"]{margin-right:4px;}
  .cell[data-row="2"],.cell[data-row="5"]{margin-bottom:4px;}

  .box-0{background:rgba(255,107,107,.32);}
  .box-1{background:rgba(255,159,67,.32);}
  .box-2{background:rgba(255,234,167,.28);}
  .box-3{background:rgba(85,239,196,.28);}
  .box-4{background:rgba(116,185,255,.32);}
  .box-5{background:rgba(162,155,254,.32);}
  .box-6{background:rgba(253,121,168,.32);}
  .box-7{background:rgba(0,206,201,.28);}
  .box-8{background:rgba(108,92,231,.32);}

  .val-1{color:#FF6B6B;} .val-2{color:#FF9F43;} .val-3{color:#F6E58D;}
  .val-4{color:#55EFC4;} .val-5{color:#74B9FF;} .val-6{color:#A29BFE;}
  .val-7{color:#FD79A8;} .val-8{color:#00CEC9;} .val-9{color:#D980FA;}

  .cell.given{font-weight:900;filter:brightness(1.4);}
  .cell.selected{border-color:#fff!important;background:rgba(255,255,255,.28)!important;transform:scale(1.08);z-index:2;box-shadow:0 0 18px rgba(255,255,255,.6);}
  .cell.highlight{filter:brightness(1.6);border-color:rgba(255,255,255,.28);}
  .cell.error{background:rgba(255,50,50,.5)!important;border-color:#ff4757!important;animation:shake .4s ease;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .cell.correct{border-color:rgba(85,239,196,.9)!important;animation:pop .4s ease;}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}

  /* ══ NUMPAD ══ */
  .numpad{
    display:grid;grid-template-columns:repeat(5,1fr);
    gap:10px;width:min(90vw,486px);
    animation:fadeUp .8s ease .6s both;
  }
  .num-btn{
    border:none;border-radius:14px;
    font-family:'Nunito',sans-serif;font-weight:900;font-size:1.4rem;
    cursor:pointer;padding:14px 0;transition:all .2s ease;
    position:relative;overflow:hidden;
  }
  .num-btn::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,0);transition:background .2s;}
  .num-btn:hover::after{background:rgba(255,255,255,.18);}
  .num-btn:hover{transform:translateY(-3px) scale(1.06);}
  .num-btn:active{transform:scale(.96);}
  .num-btn[data-n="1"]{background:linear-gradient(135deg,#FF6B6B,#ee5a24);color:#fff;box-shadow:0 4px 16px rgba(255,107,107,.6);}
  .num-btn[data-n="2"]{background:linear-gradient(135deg,#FF9F43,#f0932b);color:#fff;box-shadow:0 4px 16px rgba(255,159,67,.6);}
  .num-btn[data-n="3"]{background:linear-gradient(135deg,#F6E58D,#f9ca24);color:#444;box-shadow:0 4px 16px rgba(246,229,141,.5);}
  .num-btn[data-n="4"]{background:linear-gradient(135deg,#55EFC4,#00b894);color:#1e3030;box-shadow:0 4px 16px rgba(85,239,196,.6);}
  .num-btn[data-n="5"]{background:linear-gradient(135deg,#74B9FF,#0984e3);color:#fff;box-shadow:0 4px 16px rgba(116,185,255,.6);}
  .num-btn[data-n="6"]{background:linear-gradient(135deg,#A29BFE,#6c5ce7);color:#fff;box-shadow:0 4px 16px rgba(162,155,254,.6);}
  .num-btn[data-n="7"]{background:linear-gradient(135deg,#FD79A8,#e84393);color:#fff;box-shadow:0 4px 16px rgba(253,121,168,.6);}
  .num-btn[data-n="8"]{background:linear-gradient(135deg,#00CEC9,#00b5ad);color:#fff;box-shadow:0 4px 16px rgba(0,206,201,.6);}
  .num-btn[data-n="9"]{background:linear-gradient(135deg,#6C5CE7,#a29bfe);color:#fff;box-shadow:0 4px 16px rgba(108,92,231,.6);}
  .num-btn[data-n="0"]{background:rgba(255,255,255,.16);color:#fff;border:2px solid rgba(255,255,255,.3);font-size:1rem;box-shadow:0 4px 14px rgba(0,0,0,.2);}

  /* ══ WIN OVERLAY ══ */
  #win-overlay{
    display:none;position:fixed;inset:0;
    background:rgba(10,5,30,.88);z-index:100;
    align-items:center;justify-content:center;
    backdrop-filter:blur(10px);
  }
  #win-overlay.show{display:flex;}
  .win-box{
    text-align:center;padding:44px 50px;border-radius:30px;
    background:linear-gradient(135deg,rgba(255,107,107,.3),rgba(162,155,254,.3));
    border:2px solid rgba(255,255,255,.25);
    box-shadow:0 30px 80px rgba(0,0,0,.5);
    animation:popIn .5s cubic-bezier(.175,.885,.32,1.275);
  }
  @keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
  .win-box h2{
    font-family:'Pacifico',cursive;font-size:2.8rem;
    background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c5));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    margin-bottom:10px;
  }
  .win-box p{color:rgba(255,255,255,.85);font-size:1.1rem;margin-bottom:24px;}
  .win-time{color:#fff;font-size:1.6rem;font-weight:900;margin-bottom:24px;}
  .confetti{font-size:2.5rem;animation:spin 1.5s linear infinite;display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ══ FOOTER ══ */
  footer{text-align:center;padding:24px 16px;animation:fadeUp .8s ease .8s both;}

  .footer-line{
    font-size:1.1rem;font-weight:700;color:#fff;
    display:flex;align-items:center;justify-content:center;
    gap:10px;flex-wrap:wrap;
    text-shadow:0 2px 8px rgba(0,0,0,.5);
    line-height:1.8;
  }

  /* SVG Heart */
  .svg-heart{
    display:inline-block;
    animation:heartbeat 1.2s ease-in-out infinite;
    vertical-align:middle;
  }
  @keyframes heartbeat{
    0%,100%{transform:scale(1);}
    15%{transform:scale(1.4);}
    30%{transform:scale(1);}
    45%{transform:scale(1.2);}
  }

  .producer{
    margin-top:10px;font-size:.82rem;
    color:rgba(255,255,255,.65);letter-spacing:.06em;text-transform:uppercase;
  }
  .producer strong{color:#fff;font-weight:900;letter-spacing:.1em;}
</style>
</head>
<body>

<!-- Floating Bubbles -->
<div id="bubbles"></div>
<!-- Floating Musical Notes -->
<div id="notes"></div>

<!-- WIN OVERLAY -->
<div id="win-overlay">
  <div class="win-box">
    <div><span class="confetti">🎉</span></div>
    <h2>Bravo !</h2>
    <p>Vous avez résolu le Sudoku !</p>
    <div class="win-time" id="win-time"></div>
    <button class="btn btn-new" onclick="newGame();document.getElementById('win-overlay').classList.remove('show')">Nouvelle Partie</button>
  </div>
</div>

<div class="container">
  <header>
    <h1>🎨 Sudoku</h1>
    <p>Remplis la grille avec des chiffres de 1 à 9</p>
  </header>

  <div class="controls">
    <button class="btn btn-new"   onclick="newGame()">🎲 Nouvelle</button>
    <button class="btn btn-hint"  onclick="giveHint()">💡 Indice</button>
    <button class="btn btn-check" onclick="checkBoard()">✅ Vérifier</button>
    <button class="btn btn-solve" onclick="solveBoard()">🔮 Résoudre</button>
  </div>

  <div class="info-bar">
    <div class="timer" id="timer">⏱ 00:00</div>
    <div class="status" id="status">Bonne chance ! 🍀</div>
  </div>

  <div class="grid-wrapper">
    <div id="sudoku-grid"></div>
  </div>

  <div class="numpad" id="numpad"></div>

  <footer>
    <div class="footer-line">
      <!-- Animated gradient SVG heart -->
      <span class="svg-heart">
        <svg width="32" height="30" viewBox="0 0 32 30" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="hg1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%"  stop-color="#FF6B6B"/>
              <stop offset="50%" stop-color="#FD79A8"/>
              <stop offset="100%"stop-color="#A29BFE"/>
            </linearGradient>
          </defs>
          <path d="M16 28 C16 28 2 18 2 9 C2 4.5 5.5 1 10 1 C12.5 1 14.8 2.5 16 4.5 C17.2 2.5 19.5 1 22 1 C26.5 1 30 4.5 30 9 C30 18 16 28 16 28Z" fill="url(#hg1)"/>
        </svg>
      </span>
      Fait avec
      <!-- Big pulsing SVG heart in center -->
      <span class="svg-heart" style="animation-duration:.9s;">
        <svg width="44" height="40" viewBox="0 0 32 30" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="hg2" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%"  stop-color="#FF6B6B"/>
              <stop offset="30%" stop-color="#FF9F43"/>
              <stop offset="60%" stop-color="#FD79A8"/>
              <stop offset="100%"stop-color="#6C5CE7"/>
            </linearGradient>
          </defs>
          <path d="M16 28 C16 28 2 18 2 9 C2 4.5 5.5 1 10 1 C12.5 1 14.8 2.5 16 4.5 C17.2 2.5 19.5 1 22 1 C26.5 1 30 4.5 30 9 C30 18 16 28 16 28Z" fill="url(#hg2)" filter="drop-shadow(0 0 6px rgba(255,107,168,.8))"/>
        </svg>
      </span>
      pour tous ceux qui sont intéressé
      <span class="svg-heart">
        <svg width="32" height="30" viewBox="0 0 32 30" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="hg3" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%"  stop-color="#55EFC4"/>
              <stop offset="50%" stop-color="#74B9FF"/>
              <stop offset="100%"stop-color="#A29BFE"/>
            </linearGradient>
          </defs>
          <path d="M16 28 C16 28 2 18 2 9 C2 4.5 5.5 1 10 1 C12.5 1 14.8 2.5 16 4.5 C17.2 2.5 19.5 1 22 1 C26.5 1 30 4.5 30 9 C30 18 16 28 16 28Z" fill="url(#hg3)"/>
        </svg>
      </span>
    </div>
    <div class="producer">Produit par <strong>Souha Yassmine Elalaoui</strong></div>
  </footer>
</div>

<script>
// ══ BUBBLES ══
(function(){
  const colors=['#FF6B6B','#FF9F43','#FFEAA7','#55EFC4','#74B9FF','#A29BFE','#FD79A8','#00CEC9','#6C5CE7','#fff'];
  const c=document.getElementById('bubbles');
  for(let i=0;i<30;i++){
    const b=document.createElement('div');
    b.className='bubble';
    const sz=18+Math.random()*90;
    b.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;background:${colors[~~(Math.random()*colors.length)]};animation-duration:${9+Math.random()*15}s;animation-delay:${Math.random()*14}s;`;
    c.appendChild(b);
  }
})();

// ══ MUSICAL NOTES ══
(function(){
  const syms=['♩','♪','♫','♬','🎵','🎶','🎼','🎹','🎸','🎷','🥁','🎺'];
  const cols=['#FF6B6B','#FF9F43','#FFEAA7','#55EFC4','#74B9FF','#A29BFE','#FD79A8','#00CEC9'];
  const c=document.getElementById('notes');
  for(let i=0;i<22;i++){
    const n=document.createElement('div');
    n.className='note';
    n.textContent=syms[~~(Math.random()*syms.length)];
    n.style.cssText=`left:${Math.random()*100}%;color:${cols[~~(Math.random()*cols.length)]};font-size:${1.1+Math.random()*2}rem;animation-duration:${11+Math.random()*15}s;animation-delay:${Math.random()*16}s;text-shadow:0 0 12px currentColor;`;
    c.appendChild(n);
  }
})();

// ══ SUDOKU ENGINE ══
let board=[],solution=[],given=[],selected=null;
let timerInterval=null,seconds=0;

const PUZZLES=[
  "530070000600195000098000060800060003400803001700020006060000280000419005000080079",
  "200080300060070084030500209000105408000000000402706000301007040720040060004010003",
  "000000907000420180000705026100904000050000040000507003920108000034059000507000000",
  "006000300049070250000040960090700030600050007040009080085020000074090610001000400",
  "300200000000107000706030500070009080900020004010800050003070208000301000000005009",
  "000006000059000008200008000045000000003000600006045000000000000600000495000280030",
  "800000000003600000070090200060005030004080300010060020020008000000040700000100060",
  "530040000007080020060030000000600030010020060080001000000070004050090700000000008",
  "000075400000000008080190000300001060970000100050808006000000034000490700800000000",
];

function parsePuzzle(s){return s.split('').map(Number);}
function boxOf(r,c){return Math.floor(r/3)*3+Math.floor(c/3);}
function isValid(b,idx,val){
  const r=Math.floor(idx/9),c=idx%9,box=boxOf(r,c);
  for(let i=0;i<9;i++){
    if(b[r*9+i]===val)return false;
    if(b[i*9+c]===val)return false;
    const br=Math.floor(box/3)*3+Math.floor(i/3),bc=(box%3)*3+(i%3);
    if(b[br*9+bc]===val)return false;
  }
  return true;
}
function solve(b){
  const idx=b.indexOf(0);if(idx===-1)return true;
  for(let v=1;v<=9;v++){if(isValid(b,idx,v)){b[idx]=v;if(solve(b))return true;b[idx]=0;}}
  return false;
}
function newGame(){
  clearInterval(timerInterval);seconds=0;selected=null;
  const puzzle=PUZZLES[~~(Math.random()*PUZZLES.length)];
  board=parsePuzzle(puzzle);solution=[...board];solve(solution);
  given=board.map(v=>v!==0);
  renderGrid();updateTimer();
  timerInterval=setInterval(()=>{seconds++;updateTimer();},1000);
  setStatus('Bonne chance ! 🍀');
}
function renderGrid(){
  const grid=document.getElementById('sudoku-grid');grid.innerHTML='';
  for(let i=0;i<81;i++){
    const r=~~(i/9),c=i%9,box=boxOf(r,c);
    const cell=document.createElement('div');
    cell.className=`cell box-${box}`;
    cell.dataset.idx=i;cell.dataset.row=r;cell.dataset.col=c;
    if(given[i])cell.classList.add('given');
    setCellValue(cell,board[i]);
    cell.addEventListener('click',()=>selectCell(i));
    grid.appendChild(cell);
  }
}
function setCellValue(cell,val){
  cell.textContent=val||'';
  cell.className=cell.className.replace(/\bval-\d\b/g,'');
  if(val)cell.classList.add(`val-${val}`);
}
function selectCell(idx){
  selected=idx;
  document.querySelectorAll('.cell').forEach((c,i)=>{
    c.classList.remove('selected','highlight');
    const r=~~(i/9),c2=i%9,sr=~~(idx/9),sc=idx%9;
    if(r===sr||c2===sc||boxOf(r,c2)===boxOf(sr,sc))c.classList.add('highlight');
  });
  document.querySelectorAll('.cell')[idx].classList.add('selected');
}
function inputNumber(n){
  if(selected===null||given[selected])return;
  board[selected]=n;
  const cell=document.querySelector(`.cell[data-idx="${selected}"]`);
  setCellValue(cell,n);
  if(n&&solution[selected]!==n){
    cell.classList.add('error');setTimeout(()=>cell.classList.remove('error'),600);
    setStatus('❌ Ce chiffre est incorrect !');
  }else if(n){
    cell.classList.add('correct');setTimeout(()=>cell.classList.remove('correct'),500);
    setStatus('✅ Bien joué !');checkWin();
  }
}
function giveHint(){
  const empty=[];board.forEach((v,i)=>{if(!v&&!given[i])empty.push(i);});
  if(!empty.length)return;
  const idx=empty[~~(Math.random()*empty.length)];
  board[idx]=solution[idx];given[idx]=true;
  const cell=document.querySelector(`.cell[data-idx="${idx}"]`);
  cell.classList.add('given');setCellValue(cell,board[idx]);
  cell.classList.add('correct');setTimeout(()=>cell.classList.remove('correct'),500);
  setStatus('💡 Indice donné !');checkWin();
}
function checkBoard(){
  let errors=0;
  board.forEach((v,i)=>{
    if(v&&v!==solution[i]){errors++;
      const cell=document.querySelector(`.cell[data-idx="${i}"]`);
      cell.classList.add('error');setTimeout(()=>cell.classList.remove('error'),800);}
  });
  setStatus(errors===0?'🎉 Tout est correct !':`⚠️ ${errors} erreur${errors>1?'s':''} trouvée${errors>1?'s':''}`);
}
function solveBoard(){
  clearInterval(timerInterval);board=[...solution];given=board.map(()=>true);
  renderGrid();setStatus('🔮 Grille résolue !');
}
function checkWin(){
  if(board.every((v,i)=>v===solution[i])){
    clearInterval(timerInterval);
    setTimeout(()=>{
      document.getElementById('win-time').textContent=`⏱ Temps : ${formatTime(seconds)}`;
      document.getElementById('win-overlay').classList.add('show');
    },300);
  }
}
function buildNumpad(){
  const pad=document.getElementById('numpad');
  [1,2,3,4,5,6,7,8,9,0].forEach(n=>{
    const btn=document.createElement('button');
    btn.className='num-btn';btn.dataset.n=n;
    btn.textContent=n===0?'⌫ Effacer':n;
    btn.addEventListener('click',()=>inputNumber(n));
    pad.appendChild(btn);
  });
}
document.addEventListener('keydown',e=>{
  if(e.key>='1'&&e.key<='9')inputNumber(parseInt(e.key));
  if(e.key==='0'||e.key==='Backspace'||e.key==='Delete')inputNumber(0);
  if(selected!==null){
    const r=~~(selected/9),c=selected%9;
    if(e.key==='ArrowRight')selectCell(r*9+Math.min(c+1,8));
    if(e.key==='ArrowLeft') selectCell(r*9+Math.max(c-1,0));
    if(e.key==='ArrowDown') selectCell(Math.min(r+1,8)*9+c);
    if(e.key==='ArrowUp')   selectCell(Math.max(r-1,0)*9+c);
  }
});
function formatTime(s){return`${~~(s/60)}`.padStart(2,'0')+':'+(s%60).toString().padStart(2,'0');}
function updateTimer(){document.getElementById('timer').textContent=`⏱ ${formatTime(seconds)}`;}
function setStatus(msg){document.getElementById('status').textContent=msg;}
buildNumpad();newGame();
</script>
