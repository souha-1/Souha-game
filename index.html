<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Magique 🌟</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #FFD93D;
    --pink:   #FF6B9D;
    --blue:   #4CC9F0;
    --green:  #6BCB77;
    --purple: #C77DFF;
    --orange: #FF9F43;
    --red:    #FF6B6B;
    --white:  #FFFDF7;
    --dark:   #2D2D4E;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background-color: #E8F4FD;
    background-image:
      radial-gradient(circle at 10% 20%, rgba(255,107,157,0.15) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(76,201,240,0.15) 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(255,217,61,0.1) 0%, transparent 60%);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Floating deco ── */
  .deco { position: fixed; pointer-events: none; z-index: 0; }
  .cloud {
    background: white;
    border-radius: 50px;
    opacity: 0.7;
    animation: floatCloud linear infinite;
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: white;
    border-radius: 50%;
  }
  .c1 { width:110px; height:40px; top:8%; left:-130px; animation-duration:28s; animation-delay:0s; }
  .c1::before { width:55px; height:55px; top:-25px; left:15px; }
  .c1::after  { width:40px; height:40px; top:-18px; left:55px; }
  .c2 { width:80px; height:30px; top:30%; left:-100px; animation-duration:22s; animation-delay:6s; }
  .c2::before { width:40px; height:40px; top:-18px; left:10px; }
  .c2::after  { width:30px; height:30px; top:-14px; left:40px; }
  .c3 { width:130px; height:45px; top:65%; left:-160px; animation-duration:35s; animation-delay:12s; }
  .c3::before { width:65px; height:65px; top:-30px; left:20px; }
  .c3::after  { width:50px; height:50px; top:-22px; left:70px; }

  @keyframes floatCloud {
    from { transform: translateX(0); }
    to   { transform: translateX(calc(100vw + 200px)); }
  }

  .star-deco {
    position: fixed;
    font-size: 22px;
    animation: twinkle 2.5s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes twinkle {
    0%,100% { opacity: 1; transform: scale(1) rotate(0deg); }
    50%      { opacity: 0.4; transform: scale(0.7) rotate(20deg); }
  }

  /* ── Layout ── */
  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 0 auto;
    padding: 1.5rem 1rem 3rem;
  }

  /* ── Header ── */
  .site-header {
    text-align: center;
    margin-bottom: 1.8rem;
  }
  .title-badge {
    display: inline-block;
    background: var(--yellow);
    border-radius: 40px;
    padding: 6px 24px;
    font-size: 12px;
    font-weight: 800;
    color: #a06000;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 10px;
    box-shadow: 0 3px 0 #c9a000;
  }
  h1 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2.2rem, 6vw, 3rem);
    color: var(--dark);
    line-height: 1.1;
    letter-spacing: 0.5px;
  }
  h1 span.pink  { color: var(--pink); }
  h1 span.blue  { color: var(--blue); }
  .subtitle {
    margin-top: 6px;
    font-size: 15px;
    color: #7a7aaa;
    font-weight: 600;
  }

  /* ── Stats bar ── */
  .stats-bar {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 1.2rem;
    flex-wrap: wrap;
  }
  .stat-pill {
    background: white;
    border-radius: 50px;
    padding: 8px 18px;
    display: flex;
    align-items: center;
    gap: 7px;
    font-weight: 800;
    font-size: 15px;
    color: var(--dark);
    box-shadow: 0 4px 0 rgba(0,0,0,0.08);
    border: 2.5px solid transparent;
  }
  .stat-pill.yellow { border-color: var(--yellow); }
  .stat-pill.blue   { border-color: var(--blue); }
  .stat-pill.green  { border-color: var(--green); }
  .pill-icon { font-size: 18px; }
  .pill-label { font-size: 11px; font-weight: 700; color: #aaa; display: block; line-height: 1; }
  .pill-val   { font-size: 17px; font-weight: 800; color: var(--dark); line-height: 1; }

  /* ── Difficulty buttons ── */
  .diff-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 1.2rem;
    flex-wrap: wrap;
  }
  .diff-btn {
    font-family: 'Fredoka One', cursive;
    font-size: 15px;
    padding: 7px 18px;
    border-radius: 50px;
    border: 2.5px solid transparent;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 0 rgba(0,0,0,0.1);
    background: white;
    color: #888;
  }
  .diff-btn:hover { transform: translateY(-2px); }
  .diff-btn.active { background: var(--purple); border-color: #9d4dff; color: white; box-shadow: 0 4px 0 #7b00dd; }

  /* ── Reset button ── */
  .reset-btn {
    display: block;
    margin: 0 auto 1.4rem;
    font-family: 'Fredoka One', cursive;
    font-size: 17px;
    background: var(--pink);
    color: white;
    border: none;
    border-radius: 50px;
    padding: 10px 30px;
    cursor: pointer;
    box-shadow: 0 5px 0 #c2005a;
    transition: transform 0.12s, box-shadow 0.12s;
    letter-spacing: 0.5px;
  }
  .reset-btn:hover  { transform: translateY(-3px); box-shadow: 0 8px 0 #c2005a; }
  .reset-btn:active { transform: translateY(2px);  box-shadow: 0 2px 0 #c2005a; }

  /* ── Card grid ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  /* ── Cards ── */
  .card {
    aspect-ratio: 1;
    perspective: 700px;
    cursor: pointer;
  }
  .card-inner {
    position: relative;
    width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(.4,0,.2,1);
  }
  .card.flipped .card-inner,
  .card.matched .card-inner { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    width: 100%; height: 100%;
    backface-visibility: hidden;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(24px, 6vw, 40px);
  }

  .card-back {
    background: white;
    border: 3px solid var(--blue);
    box-shadow: 0 5px 0 rgba(76,201,240,0.4);
    transition: transform 0.1s;
  }
  .card:hover:not(.flipped):not(.matched) .card-back {
    transform: translateY(-4px);
    box-shadow: 0 9px 0 rgba(76,201,240,0.3);
  }
  .card-back-inner {
    width: 60%;
    height: 60%;
    border-radius: 12px;
    background: repeating-linear-gradient(
      45deg,
      rgba(76,201,240,0.15),
      rgba(76,201,240,0.15) 5px,
      rgba(76,201,240,0.05) 5px,
      rgba(76,201,240,0.05) 10px
    );
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(18px, 4vw, 28px);
  }

  .card-front {
    background: white;
    border: 3px solid #e0e0f0;
    box-shadow: 0 5px 0 rgba(0,0,0,0.07);
    transform: rotateY(180deg);
  }
  .card.matched .card-front {
    background: #f0fff4;
    border-color: var(--green);
    box-shadow: 0 5px 0 rgba(107,203,119,0.4);
    animation: popMatch 0.4s cubic-bezier(.3,1.6,.5,1) both;
  }
  @keyframes popMatch {
    0%   { transform: rotateY(180deg) scale(1); }
    50%  { transform: rotateY(180deg) scale(1.18); }
    100% { transform: rotateY(180deg) scale(1); }
  }

  /* ── Win banner ── */
  .win-banner {
    display: none;
    text-align: center;
    margin-top: 1.5rem;
    padding: 1.5rem;
    background: white;
    border-radius: 24px;
    border: 3px dashed var(--yellow);
    box-shadow: 0 8px 0 rgba(255,217,61,0.3);
    animation: bounceIn 0.5s cubic-bezier(.3,1.6,.5,1);
  }
  .win-banner.show { display: block; }
  @keyframes bounceIn {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .win-emoji { font-size: 48px; display: block; margin-bottom: 8px; animation: spin 0.8s ease; }
  @keyframes spin { from { transform: rotate(-20deg) scale(0.5); } to { transform: rotate(0deg) scale(1); } }
  .win-title {
    font-family: 'Fredoka One', cursive;
    font-size: 26px;
    color: var(--dark);
    margin-bottom: 6px;
  }
  .win-sub { font-size: 15px; color: #888; font-weight: 700; margin-bottom: 14px; }
  .win-play-again {
    font-family: 'Fredoka One', cursive;
    font-size: 16px;
    background: var(--green);
    color: white;
    border: none;
    border-radius: 50px;
    padding: 10px 28px;
    cursor: pointer;
    box-shadow: 0 5px 0 #3d9e48;
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .win-play-again:hover  { transform: translateY(-3px); box-shadow: 0 8px 0 #3d9e48; }
  .win-play-again:active { transform: translateY(2px);  box-shadow: 0 2px 0 #3d9e48; }

  /* ── Footer ── */
  .site-footer {
    text-align: center;
    margin-top: 2rem;
    font-size: 13px;
    color: #bbb;
    font-weight: 600;
  }

  /* ── Confetti ── */
  .confetti-piece {
    position: fixed;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    opacity: 0;
    pointer-events: none;
    z-index: 999;
    animation: confettiFall 1.8s ease-in forwards;
  }
  @keyframes confettiFall {
    0%   { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(80vh) rotate(720deg); }
  }

  @media (max-width: 420px) {
    .grid { gap: 8px; }
    .card-face { border-radius: 14px; }
  }
</style>
</head>
<body>

<!-- Floating clouds -->
<div class="deco cloud c1"></div>
<div class="deco cloud c2"></div>
<div class="deco cloud c3"></div>

<!-- Twinkling stars -->
<div class="star-deco" style="top:5%;  left:5%;  animation-delay:0s;">⭐</div>
<div class="star-deco" style="top:12%; right:8%; animation-delay:0.7s; font-size:16px;">✨</div>
<div class="star-deco" style="top:45%; left:2%; animation-delay:1.3s; font-size:18px;">🌟</div>
<div class="star-deco" style="top:70%; right:4%; animation-delay:0.4s; font-size:14px;">⭐</div>
<div class="star-deco" style="bottom:8%; left:10%; animation-delay:1.8s;">✨</div>
<div class="star-deco" style="bottom:15%; right:6%; animation-delay:0.9s; font-size:20px;">🌟</div>

<div class="wrapper">

  <!-- Header -->
  <header class="site-header">
    <div class="title-badge">🎮 Jeu pour enfants</div>
    <h1><span class="pink">Memory</span> <span class="blue">Magique</span> 🪄</h1>
    <p class="subtitle">Retrouve toutes les paires cachées !</p>
  </header>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-pill yellow">
      <span class="pill-icon">🎯</span>
      <span><span class="pill-label">Essais</span><span class="pill-val" id="moves">0</span></span>
    </div>
    <div class="stat-pill blue">
      <span class="pill-icon">💫</span>
      <span><span class="pill-label">Paires</span><span class="pill-val" id="pairs">0 / 8</span></span>
    </div>
    <div class="stat-pill green">
      <span class="pill-icon">⏱️</span>
      <span><span class="pill-label">Temps</span><span class="pill-val" id="timer">0s</span></span>
    </div>
  </div>

  <!-- Difficulty -->
  <div class="diff-row">
    <button class="diff-btn active" data-pairs="8" data-cols="4">🐣 Facile (4×4)</button>
    <button class="diff-btn" data-pairs="10" data-cols="4">🦊 Moyen (4×5)</button>
    <button class="diff-btn" data-pairs="15" data-cols="6">🦁 Expert (6×5)</button>
  </div>

  <!-- Reset -->
  <button class="reset-btn" id="resetBtn">🔄 Nouvelle Partie</button>

  <!-- Grid -->
  <div class="grid" id="grid"></div>

  <!-- Win banner -->
  <div class="win-banner" id="winBanner">
    <span class="win-emoji">🏆</span>
    <div class="win-title">Bravo ! Tu as gagné !</div>
    <div class="win-sub" id="winSub"></div>
    <button class="win-play-again" id="playAgainBtn">🎉 Rejouer !</button>
  </div>

  <footer class="site-footer">Fait avec 💖 pour les petits explorateurs</footer>
</div>

<script>
const EMOJIS = ["🐶","🐱","🐰","🦊","🐻","🐼","🐨","🦁","🦋","🐸","🐙","🦄","🌈","🍓","🍦","🎈","🚀","⭐","🎸","🐠"];

let state = { flipped:[], matched:0, moves:0, lock:false, timer:null, seconds:0, total:8, cols:4 };

const $ = id => document.getElementById(id);

function shuffle(arr){ return [...arr].sort(()=>Math.random()-0.5); }

function startTimer(){
  clearInterval(state.timer);
  state.timer = setInterval(()=>{
    state.seconds++;
    $('timer').textContent = state.seconds+'s';
  },1000);
}

function init(pairs=8, cols=4){
  clearInterval(state.timer);
  state = { flipped:[], matched:0, moves:0, lock:false, timer:null, seconds:0, total:pairs, cols };
  $('moves').textContent = '0';
  $('pairs').textContent = '0 / '+pairs;
  $('timer').textContent = '0s';
  $('winBanner').classList.remove('show');

  const grid = $('grid');
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  const cards = shuffle([...EMOJIS.slice(0,pairs), ...EMOJIS.slice(0,pairs)]);
  grid.innerHTML = '';

  cards.forEach((emoji, i)=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.emoji = emoji;
    card.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back"><div class="card-back-inner">🌟</div></div>
        <div class="card-face card-front">${emoji}</div>
      </div>`;
    card.addEventListener('click', ()=>onCardClick(card));
    grid.appendChild(card);
  });
}

function onCardClick(card){
  if(state.lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
  if(state.moves===0 && state.flipped.length===0) startTimer();
  card.classList.add('flipped');
  state.flipped.push(card);

  if(state.flipped.length===2){
    state.moves++;
    $('moves').textContent = state.moves;
    state.lock = true;
    const [a,b] = state.flipped;

    if(a.dataset.emoji === b.dataset.emoji){
      a.classList.add('matched'); b.classList.add('matched');
      state.matched++;
      $('pairs').textContent = state.matched+' / '+state.total;
      state.flipped = [];
      state.lock = false;

      if(state.matched === state.total){
        clearInterval(state.timer);
        setTimeout(()=>{
          launchConfetti();
          $('winSub').textContent = `${state.moves} essais en ${state.seconds} secondes !`;
          $('winBanner').classList.add('show');
        }, 400);
      }
    } else {
      setTimeout(()=>{
        a.classList.remove('flipped'); b.classList.remove('flipped');
        state.flipped = [];
        state.lock = false;
      }, 950);
    }
  }
}

function launchConfetti(){
  const colors = ['#FFD93D','#FF6B9D','#4CC9F0','#6BCB77','#C77DFF','#FF9F43','#FF6B6B'];
  for(let i=0;i<60;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100+'vw';
    p.style.top  = '-10px';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDelay = Math.random()*0.8+'s';
    p.style.width  = (8+Math.random()*8)+'px';
    p.style.height = (8+Math.random()*8)+'px';
    p.style.borderRadius = Math.random()>0.5 ? '50%' : '2px';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 2500);
  }
}

$('resetBtn').addEventListener('click', ()=>init(state.total, state.cols));
$('playAgainBtn').addEventListener('click', ()=>init(state.total, state.cols));

document.querySelectorAll('.diff-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const pairs = parseInt(btn.dataset.pairs);
    const cols  = parseInt(btn.dataset.cols);
    init(pairs, cols);
  });
});

init(8,4);
</script>
</body>
</html>
